name: Deploy blocksy-child → Hostinger

on:
  push:
    branches: [main]
    paths:
      - 'blocksy-child/**'

jobs:
  deploy:
    name: Rsync + purge cache
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      # Garde-fou : une erreur de syntaxe PHP dans le child theme = écran blanc
      # sur tout le site. On refuse de déployer si un fichier ne passe pas le lint.
      - name: Lint PHP
        run: |
          find blocksy-child -name '*.php' -print0 | xargs -0 -n1 php -l

      - name: Setup SSH
        run: |
          mkdir -p ~/.ssh
          printf '%s\n' "${{ secrets.SSH_KEY }}" > ~/.ssh/deploy_key
          chmod 600 ~/.ssh/deploy_key

      - name: Créer le dossier distant si absent
        run: |
          ssh -i ~/.ssh/deploy_key -p 65002 -o StrictHostKeyChecking=no \
            ${{ secrets.SSH_USER }}@${{ secrets.SSH_HOST }} \
            "mkdir -p /home/${{ secrets.SSH_USER }}/domains/rigolettres.fr/public_html/wp-content/themes/blocksy-child"

      - name: Déployer via rsync
        run: |
          rsync -avz --checksum --delete \
            --exclude='.git' \
            --exclude='README.md' \
            -e "ssh -i ~/.ssh/deploy_key -p 65002 -o StrictHostKeyChecking=no" \
            blocksy-child/ \
            ${{ secrets.SSH_USER }}@${{ secrets.SSH_HOST }}:/home/${{ secrets.SSH_USER }}/domains/rigolettres.fr/public_html/wp-content/themes/blocksy-child/

      # La purge est faite par le thème (includes/purge-cache-au-deploiement.php) à la
      # première requête PHP qui suit un déploiement. On appelle donc une URL jamais
      # mise en cache pour la déclencher, puis on vérifie que la page d'accueil
      # servie aux visiteurs référence bien la feuille de style qu'on vient d'envoyer.
      # (L'ancienne étape appelait /wp-json/litespeed/v1/purge/all, qui répond 404.)
      - name: Déclencher la purge du cache
        run: |
          code=$(curl -s -o /dev/null -w "%{http_code}" "https://rigolettres.fr/?rigo-deploy=${{ github.sha }}")
          echo "Réponse du site : $code"
          test "$code" = "200"

      - name: Vérifier que la page d'accueil est à jour
        run: |
          sleep 20
          live=$(curl -s "https://rigolettres.fr/" | grep -o 'blocksy-child/style.css?ver=[0-9]*' | head -1)
          fresh=$(curl -s "https://rigolettres.fr/?rigo-check=${{ github.run_id }}" | grep -o 'blocksy-child/style.css?ver=[0-9]*' | head -1)
          echo "Page en cache : $live"
          echo "Page fraîche  : $fresh"
          if [ "$live" != "$fresh" ]; then
            echo "::warning::La page d'accueil en cache n'est pas encore à jour (purge LiteSpeed ou CDN Hostinger à vérifier)."
          fi
